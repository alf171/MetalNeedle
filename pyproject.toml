[project]
name = "metalneedle"
version = "0.1.0"
description = "Pytorch like library built from scratch for learning purposes"
authors = [
    {name = "alf171",email = "alfonso.laffont@gmail.com"}
]
license = {text = "mit"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pybind11 (>=2.13.6,<3.0.0)",
    "numpy (>=2.2.3,<3.0.0)",
    "torch (>=2.6.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
